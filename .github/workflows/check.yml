name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ vars.CI_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for tools/ tests
        run: python3 -m pip install --quiet pytest
      - name: Validate repository (offline)
        run: python3 scripts/check.py --offline
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
