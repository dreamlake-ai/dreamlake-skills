name: Generated skills integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/sync-docs.py --verify-files
      # Source repos are private. No private token is exposed to public PRs.
      # Maintainers must run current-source --check with authorized checkouts;
      # this workflow does not claim cross-repository freshness.
