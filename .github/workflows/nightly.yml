name: Nightly reference sync and release
# Refreshes every skill's reference/ from the docs sites, commits the result when
# it validates, and releases a vYYYY.MM.DD tag whenever main has moved since the
# last tag. Needs only GITHUB_TOKEN. Manual tags still work for urgent releases.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  sync-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for tools/ tests
        run: python3 -m pip install --quiet pytest
      - name: Fetch reference pages from the docs sites
        run: python3 scripts/sync_references.py
      - name: Validate
        run: |
          python3 scripts/check.py --offline
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit refreshed references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'reference/ is unchanged'
          else
            git commit -m 'sync: refresh reference/ from the docs sites'
            git push origin HEAD:refs/heads/main
          fi
      - name: Decide whether to release
        id: decide
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "$last^{commit}")" ]; then
            echo "HEAD is already released as $last"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done
          echo "releasing $tag (last tag: ${last:-none})"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag, package and release
        if: steps.decide.outputs.tag != ''
        run: |
          tag='${{ steps.decide.outputs.tag }}'
          git tag "$tag"
          git push origin "refs/tags/$tag"
          python3 scripts/catalog.py --version "$tag"
          python3 scripts/package.py
          notes="$(printf 'DreamLake skills %s\n\n```\n%s\n```\nInstall with `dreamlake skill install <name>`, or extract skills.tar.gz into .claude/skills/ or .agents/skills/.' "$tag" "$(cd dist && sha256sum skills.tar.gz catalog.json)")"
          gh release create "$tag" dist/skills.tar.gz dist/catalog.json --title "$tag" --notes "$notes"
